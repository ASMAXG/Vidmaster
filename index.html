  scrollbar-width:none
}

/* Popup animations - transform only */

@keyframes backdropIn{
  from{
    opacity:0
  }

  to{
    opacity:1
  }
}

@keyframes backdropOut{
  from{
    opacity:1
  }

  to{
    opacity:0
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.96) translateY(8px) translateZ(0)
  }

  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) translateY(0) translateZ(0)
  }
}

@keyframes modalOut{
  from{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) translateY(0) translateZ(0)
  }

  to{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.96) translateY(8px) translateZ(0)
  }
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:scale(0.96) translateY(8px) translateZ(0)
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0) translateZ(0)
  }
}

@keyframes panelOut{
  from{
    opacity:1;
    transform:scale(1) translateY(0) translateZ(0)
  }

  to{
    opacity:0;
    transform:scale(0.96) translateY(8px) translateZ(0)
  }
}

.modal-backdrop{
  animation:backdropIn 200ms ease forwards;
  will-change:opacity;
  transform:translateZ(0)
}

.modal-backdrop.out{
  animation:backdropOut 200ms ease forwards
}

.modal-shell{
  animation:modalIn 280ms cubic-bezier(0.2,0,0,1) forwards;
  will-change:transform,opacity;
  transform:translateZ(0);
  transform-origin:center center
}

.modal-shell.out{
  animation:modalOut 200ms cubic-bezier(0.2,0,0,1) forwards
}

.panel-shell{
  animation:panelIn 280ms cubic-bezier(0.2,0,0,1) forwards;
  will-change:transform,opacity;
  transform:translateZ(0);
  transform-origin:top right
}

.panel-shell.out{
  animation:panelOut 200ms cubic-bezier(0.2,0,0,1) forwards
}

.btn-press:active{
  transform:scale(0.98) translateZ(0)
}
